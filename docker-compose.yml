services:
  api:
    build: .
    image: learnsphere-api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      Llm__Provider: ${LLM_PROVIDER:-Mock}
      Llm__ApiKey: ${GEMINI_API_KEY:-}
      Llm__Model: ${LLM_MODEL:-}
    volumes:
      - learnsphere-data:/app/App_Data
    restart: unless-stopped
volumes:
  learnsphere-data:
